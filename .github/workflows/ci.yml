name: CI

on:
  push:
    branches: [main]
    # una versione è un tag: la CI dà il suo verdetto anche sul commit taggato
    tags: ['v*']
  pull_request:

# Il GITHUB_TOKEN legge soltanto. Il repo è pubblico e la CI non pubblica niente: una versione è un tag, e i frontend la
# installano da Composer.
permissions:
  contents: read

jobs:
  ci:
    # Un giro per ogni versione minore di zr-auth che composer.json accetta: la 0.6, la 0.7 che i frontend hanno, la 0.8, la
    # 0.9 e la 0.10 che viene. Un giro rosso non ferma gli altri: si vedono tutti, e il verde è di tutti. Le voci stanno fra
    # apici: senza, YAML legge 0.10 come il numero 0.1.
    name: ci (zr-auth ${{ matrix.zr-auth }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zr-auth: ['0.6', '0.7', '0.8', '0.9', '0.10']
    steps:
      - uses: actions/checkout@v4
        with:
          # il token non resta in .git/config per i passi successivi
          persist-credentials: false

      # azione di terzi: fissata allo sha, non al tag (un tag si può spostare)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, xml
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: composer.json valido
        run: composer validate --strict

      # Pacchetto pubblico: un segreto qui dentro è pubblicato. Lo stesso controllo di zr-auth; si lancia anche in locale.
      - name: Nessun segreto nel repo
        run: bash .github/nessun-segreto.sh

      # Lo zip del tag, ciò che Composer dà a un frontend: solo ciò che serve a chi installa, né i test né la pagina di prova.
      - name: Lo zip del pacchetto
        run: bash .github/zip-del-pacchetto.sh

      # Libreria: nessun composer.lock nel repo, le dipendenze si risolvono a ogni run. Di zr-auth si installa l'ultima
      # versione della minore di questo giro: il log dice quale, e se composer ne ha scelta un'altra il giro si ferma.
      - name: Dipendenze PHP
        shell: bash
        env:
          ZR_AUTH: ${{ matrix.zr-auth }}
        run: |
          composer update --prefer-dist --no-interaction --no-progress --with "zeiras/zr-auth:~${ZR_AUTH}.0"
          installata=$(composer show zeiras/zr-auth --format=json | jq -r '.versions[0]')
          echo "zr-auth installato: ${installata}"
          case "${installata}" in "v${ZR_AUTH}."*) ;; *) echo "non è una ${ZR_AUTH}"; exit 1 ;; esac

      # Tutti i file PHP del repo, non il diff: su un push a main il diff è vuoto. Un file rotto non ferma il giro
      # (exit 1, non 255): si vedono tutti. shell: bash porta pipefail, così un ls-files fallito non passa verde.
      - name: Sintassi
        shell: bash
        run: git ls-files -z '*.php' | xargs -0 -r -n1 sh -c 'php -l "$0" || exit 1'

      - name: Stile
        run: ./vendor/bin/pint --test

      - name: Analisi statica
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # vitest dopo i tipi e prima del build: le lingue e i componenti si provano in Node, con un DOM finto. Poi le pagine di
      # prova (`npm run demo`), con Inertia vera: non entrano nel pacchetto, ma la UAT gira lì, e devono costruirsi.
      - name: Dipendenze JS, tipi, test (vitest), build dei componenti e delle pagine di prova
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npm run build
          npm run demo

      - name: Test (Pest, Testbench)
        run: ./vendor/bin/pest
